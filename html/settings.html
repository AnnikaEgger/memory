<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory | Settings</title>
  </head>
  <body data-theme="code vibes">
    <div class="headline-wrapper">
      <h1>Settings</h1>
      <img src="/assets/icons/line-with-square-long.svg" alt="" />
    </div>

    <div class="content-wrapper-settings">
      <form class="game-settings">
        <fieldset id="game-themes" class="game-settings__group">
          <legend>
            <img src="/assets/icons/palette.svg" alt="Art Palette Icon" />
            <p>Game themes</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="code-vibes-theme"
                name="game themes"
                value="code vibes"
              />
              <label for="code-vibes-theme">Code vibes theme</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="gaming-theme"
                name="game themes"
                value="gaming"
              />
              <label for="gaming-theme">Gaming theme</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="players" class="game-settings__group">
          <legend>
            <img src="/assets/icons/chess-pawn.svg" alt="Chess Pawn Icon" />
            <p>Choose player</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="color-blue"
                name="player color"
                value="blue"
              />
              <label for="color-blue">Blue</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="color-orange"
                name="player color"
                value="orange"
              />
              <label for="color-orange">Orange</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="board-sizes" class="game-settings__group">
          <legend>
            <img src="/assets/icons/board-size.svg" alt="Cards Icon" />
            <p>Board size</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="16-cards"
                name="amount of cards"
                value="16"
              />
              <label for="16-cards">16 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="24-cards"
                name="amount of cards"
                value="24"
              />
              <label for="24-cards">24 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="32-cards"
                name="amount of cards"
                value="32"
              />
              <label for="32-cards">32 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>
      </form>

      <div class="settings-summary">
        <div data-theme="code vibes" class="game-preview">
          <header class="infobar infobar--settings">
            <div class="score score--settings">

              </div>
            </div>

            <div class="current-player current-player--settings">
              <p>Current player:</p>

              <img
                class="current-player__svg current-player__svg--code-vibes"
                src="../public/assets/icons/code-vibes-theme/label.svg"
                alt="Blue Label"
              />

              <img
                class="current-player__svg current-player__svg--gaming"
                src="../public/assets/icons/games-theme/current-player-chess-pawn.svg"
                alt="Chess Pawn Icon"
              />
            </div>

            <button class="btn exit-game-btn exit-game-btn--settings">

                width="11"

          </header>

          <div class="game-preview__cards">
            <div class="card card--back card--settings">
              <img
                class="img-code-vibes"
                src="/assets/icons/developer-akademie.svg"
                alt="Developer Akademie Icon"
              />
            </div>
            <div class="card card--front card--settings">
              <img
                class="img-code-vibes"
                src="/assets/icons/code-vibes-theme/git.svg"
                alt="Git Logo"
              />
              <img
                class="img-gaming"
                src="../public/assets/icons/games-theme/cubes.png"
                alt="two cubes"
              />
            </div>
          </div>
        </div>

        <div class="chosen-settings">
          <p id="chosen-theme">Theme</p>
          <img src="/assets/icons/yellow-slash.svg" alt="Yellow Slash" />
          <p id="chosen-player">Player</p>
          <img src="/assets/icons/yellow-slash.svg" alt="Yellow Slash" />
          <p id="chosen-board-size">Board size</p>
          <a href="game.html" class="btn btn--primary btn-settings">
            <svg
              width="20"
              height="16"
              viewBox="0 0 20 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >

</html>
