<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory | Settings</title>
  </head>
  <body data-theme="code vibes">
    <div class="headline-wrapper">
      <h1>Settings</h1>
      <img src="/assets/icons/line-with-square-long.svg" alt="" />
    </div>

    <div class="content-wrapper-settings">
      <form class="game-settings">
        <fieldset id="game-themes" class="game-settings__group">
          <legend>
            <img src="/assets/icons/palette.svg" alt="Art Palette Icon" />
            <p>Game themes</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="code-vibes-theme"
                name="game themes"
                value="code vibes"
                checked
              />
              <label for="code-vibes-theme">Code vibes theme</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="gaming-theme"
                name="game themes"
                value="gaming"
              />
              <label for="gaming-theme">Gaming theme</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="players" class="game-settings__group">
          <legend>
            <img src="/assets/icons/chess-pawn.svg" alt="Chess Pawn Icon" />
            <p>Choose player</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="color-blue"
                name="player color"
                value="blue"
                checked
              />
              <label for="color-blue">Blue</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="color-orange"
                name="player color"
                value="orange"
              />
              <label for="color-orange">Orange</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="board-sizes" class="game-settings__group">
          <legend>
            <img src="/assets/icons/board-size.svg" alt="Cards Icon" />
            <p>Board size</p>
          </legend>

          <div class="options-wrapper">
            <div class="option">
              <input
                type="radio"
                id="16-cards"
                name="amount of cards"
                value="16 cards"
                checked
              />
              <label for="16-cards">16 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="24-cards"
                name="amount of cards"
                value="24 cards"
              />
              <label for="24-cards">24 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>

            <div class="option">
              <input
                type="radio"
                id="32-cards"
                name="amount of cards"
                value="32 cards"
              />
              <label for="32-cards">32 cards</label>
              <img
                src="/assets/icons/line-with-square-small.svg"
                alt="Line With Square"
              />
            </div>
          </div>
        </fieldset>
      </form>

      <div class="settings-summary">
        <div data-theme="code vibes" class="game-preview">
          <header class="infobar infobar--settings">
            <div class="score-code-vibes">
              <div class="score-player score-player--1">
                <svg
                  class="current-player-svg--code-vibes"
                  width="10"
                  height="8"
                  viewBox="0 0 10 8"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1.02564 8C0.74359 8 0.502137 7.90208 0.301282 7.70625C0.100427 7.51042 0 7.275 0 7V1C0 0.725 0.100427 0.489583 0.301282 0.29375C0.502137 0.0979167 0.74359 0 1.02564 0H6.66667C6.82906 0 6.98291 0.0354167 7.12821 0.10625C7.2735 0.177083 7.39316 0.275 7.48718 0.4L9.79487 3.4C9.93162 3.575 10 3.775 10 4C10 4.225 9.93162 4.425 9.79487 4.6L7.48718 7.6C7.39316 7.725 7.2735 7.82292 7.12821 7.89375C6.98291 7.96458 6.82906 8 6.66667 8H1.02564Z"
                    fill="#2BB1FF"
                  />
                </svg>
                <p class="player-color">Blue</p>
                <p>0</p>
              </div>

              <div class="score-player score-player--2">
                <svg
                  class="current-player-svg--code-vibes"
                  width="10"
                  height="8"
                  viewBox="0 0 10 8"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1.02564 8C0.74359 8 0.502137 7.90208 0.301282 7.70625C0.100427 7.51042 0 7.275 0 7V1C0 0.725 0.100427 0.489583 0.301282 0.29375C0.502137 0.0979167 0.74359 0 1.02564 0H6.66667C6.82906 0 6.98291 0.0354167 7.12821 0.10625C7.2735 0.177083 7.39316 0.275 7.48718 0.4L9.79487 3.4C9.93162 3.575 10 3.775 10 4C10 4.225 9.93162 4.425 9.79487 4.6L7.48718 7.6C7.39316 7.725 7.2735 7.82292 7.12821 7.89375C6.98291 7.96458 6.82906 8 6.66667 8H1.02564Z"
                    fill="rgba(245, 142, 57, 1)"
                  />
                </svg>
                <p class="player-color">Orange</p>
                <p>6</p>
              </div>
            </div>
            <div class="current-player current-player--settings">
              <p>Current player:</p>
              <svg
                class="current-player-svg--code-vibes"
                width="10"
                height="8"
                viewBox="0 0 10 8"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1.02564 8C0.74359 8 0.502137 7.90208 0.301282 7.70625C0.100427 7.51042 0 7.275 0 7V1C0 0.725 0.100427 0.489583 0.301282 0.29375C0.502137 0.0979167 0.74359 0 1.02564 0H6.66667C6.82906 0 6.98291 0.0354167 7.12821 0.10625C7.2735 0.177083 7.39316 0.275 7.48718 0.4L9.79487 3.4C9.93162 3.575 10 3.775 10 4C10 4.225 9.93162 4.425 9.79487 4.6L7.48718 7.6C7.39316 7.725 7.2735 7.82292 7.12821 7.89375C6.98291 7.96458 6.82906 8 6.66667 8H1.02564Z"
                  fill="#2BB1FF"
                />
              </svg>
            </div>

            <button class="btn exit-game-btn exit-game-btn--code-vibes">
              <svg
                width="11"
                height="9"
                viewBox="0 0 11 9"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M8.575 5H3C2.85833 5 2.73958 4.95208 2.64375 4.85625C2.54792 4.76042 2.5 4.64167 2.5 4.5C2.5 4.35833 2.54792 4.23958 2.64375 4.14375C2.73958 4.04792 2.85833 4 3 4H8.575L8.15 3.575C8.05 3.475 8.00208 3.35833 8.00625 3.225C8.01042 3.09167 8.05833 2.975 8.15 2.875C8.25 2.775 8.36875 2.72292 8.50625 2.71875C8.64375 2.71458 8.7625 2.7625 8.8625 2.8625L10.15 4.15C10.25 4.25 10.3 4.36667 10.3 4.5C10.3 4.63333 10.25 4.75 10.15 4.85L8.8625 6.1375C8.7625 6.2375 8.64375 6.28542 8.50625 6.28125C8.36875 6.27708 8.25 6.225 8.15 6.125C8.05833 6.025 8.01042 5.90833 8.00625 5.775C8.00208 5.64167 8.05 5.525 8.15 5.425L8.575 5ZM6 2.5V1H1V8H6V6.5C6 6.35833 6.04792 6.23958 6.14375 6.14375C6.23958 6.04792 6.35833 6 6.5 6C6.64167 6 6.76042 6.04792 6.85625 6.14375C6.95208 6.23958 7 6.35833 7 6.5V8C7 8.275 6.90208 8.51042 6.70625 8.70625C6.51042 8.90208 6.275 9 6 9H1C0.725 9 0.489583 8.90208 0.29375 8.70625C0.0979167 8.51042 0 8.275 0 8V1C0 0.725 0.0979167 0.489583 0.29375 0.29375C0.489583 0.0979167 0.725 0 1 0H6C6.275 0 6.51042 0.0979167 6.70625 0.29375C6.90208 0.489583 7 0.725 7 1V2.5C7 2.64167 6.95208 2.76042 6.85625 2.85625C6.76042 2.95208 6.64167 3 6.5 3C6.35833 3 6.23958 2.95208 6.14375 2.85625C6.04792 2.76042 6 2.64167 6 2.5Z"
                  fill="white"
                />
              </svg>
              <p>Exit game</p>
            </button>
          </header>

          <!-- <div class="game-preview__cards">
            <div
              class="card card-code-vibes card-code-vibes--back card-code-vibes--settings"
            >
              <img
                src="/assets/icons/developer-akademie.svg"
                alt="Developer Akademie Icon"
              />
            </div>
            <div
              class="card card-code-vibes card-code-vibes--front card-code-vibes--settings"
            >
              <img
                src="/assets/icons/code-vibes-theme/git.svg"
                alt="Git Logo"
              />
            </div>
          </div> -->

          <div class="game-preview__cards">
            <div
              class="card card-code-vibes card-code-vibes--back card-code-vibes--settings"
            >
              <img
                src="/assets/icons/developer-akademie.svg"
                alt="Developer Akademie Icon"
              />
            </div>
            <div
              class="card card-code-vibes card-code-vibes--front card-code-vibes--settings"
            >
              <img
                src="/assets/icons/code-vibes-theme/git.svg"
                alt="Git Logo"
              />
            </div>
          </div>
        </div>

        <div class="chosen-settings">
          <p>Theme</p>
          <img src="/assets/icons/yellow-slash.svg" alt="Yellow Slash" />
          <p>Player</p>
          <img src="/assets/icons/yellow-slash.svg" alt="Yellow Slash" />
          <p>Board size</p>
          <a href="game.html" class="btn btn--primary btn-settings">
            <svg
              width="20"
              height="16"
              viewBox="0 0 20 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8.275 12L13.85 8.425C14 8.325 14.075 8.18333 14.075 8C14.075 7.81667 14 7.675 13.85 7.575L8.275 4C8.10833 3.88333 7.9375 3.875 7.7625 3.975C7.5875 4.075 7.5 4.225 7.5 4.425V11.575C7.5 11.775 7.5875 11.925 7.7625 12.025C7.9375 12.125 8.10833 12.1167 8.275 12ZM2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V14C20 14.55 19.8042 15.0208 19.4125 15.4125C19.0208 15.8042 18.55 16 18 16H2ZM2 14H18V2H2V14Z"
                fill="#303131"
              />
            </svg>
            <p>Start</p>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="../src/ts/settings.ts"></script>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
